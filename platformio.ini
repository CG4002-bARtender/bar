[env:base]
platform = espressif32
board = dfrobot_firebeetle2_esp32e
framework = arduino
monitor_speed = 115200

[env:blink]
extends = env:base
build_src_filter = +<scripts/blink.cpp>

[env:test_mic]
extends = env:base
build_src_filter = +<scripts/test_mic.cpp> +<sensors/mic_sensor.cpp>

[env:test_button]
extends = env:base
build_src_filter = +<scripts/test_button.cpp> +<sensors/button_sensor.cpp>

[env:test_hall]
extends = env:base
build_src_filter = +<scripts/test_hall.cpp> +<sensors/hall_sensor.cpp>

[env:test_ble]
extends = env:base
build_src_filter = +<scripts/test_ble.cpp> +<comms/ble_server.cpp>
lib_deps=
  h2zero/NimBLE-Arduino@^1.4.2

[env:test_mqtt]
extends = env:base
build_src_filter = +<scripts/test_mqtt.cpp> +<comms/mqtt_client.cpp>
lib_deps=
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2

[env:test_ble_mqtt]
extends = env:base
build_src_filter = +<scripts/test_ble_mqtt.cpp> +<comms/ble_server.cpp> +<comms/mqtt_client.cpp>
lib_deps=
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2


[env:test_ble_mqtt_publisher]
extends = env:base
build_src_filter = +<scripts/test_ble_mqtt_publisher.cpp> +<comms/ble_server.cpp>
lib_deps=
    h2zero/NimBLE-Arduino@^1.4.2

[env:test_ble_mqtt_receiver]
extends = env:base
build_src_filter = +<scripts/test_ble_mqtt_receiver.cpp> +<comms/mqtt_client.cpp>
lib_deps=
    h2zero/NimBLE-Arduino@^1.4.2
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2

[env:test_stream_record]
extends = env:base
build_src_filter = +<scripts/test_stream_record.cpp> +<sensors/button_sensor.cpp> +<comms/mqtt_client.cpp> +<sensors/mic_sensor.cpp> +<actuators/mic_led.cpp>
lib_deps=
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2

[env:main]
extends = env:base
build_src_filter = +<**/*> -<scripts/*>
lib_deps=
    knolleary/PubSubClient@^2.8
    bblanchon/ArduinoJson@^7.4.2
    h2zero/NimBLE-Arduino@^1.4.2
